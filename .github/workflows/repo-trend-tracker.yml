name: Repo Trend Tracker

on:
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch: {}

concurrency:
  group: repo-trend-tracker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo-trend-tracker
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          GROQ_API_KEY_FOR_AUTO_EMAIL: ${{ secrets.GROQ_API_KEY_FOR_AUTO_EMAIL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://prafullkherde.github.io/git-populer-repo-tracker/repo-trend-tracker/' }}
        run: python track_and_notify.py

      - name: Add dashboard link to run summary
        if: ${{ always() && steps.checkout.conclusion == 'success' }}
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://prafullkherde.github.io/git-populer-repo-tracker/repo-trend-tracker/' }}
        run: |
          printf '[Open the Repo Trend Tracker dashboard](%s)\n' "$DASHBOARD_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated tracker data
        if: ${{ always() && steps.checkout.conclusion == 'success' && !cancelled() }}
        working-directory: .
        run: |
          mkdir -p docs/repo-trend-tracker
          cp repo-trend-tracker/dashboard/index.html docs/repo-trend-tracker/index.html
          cp repo-trend-tracker/dashboard/data.json docs/repo-trend-tracker/data.json
          cp repo-trend-tracker/data/health.json docs/repo-trend-tracker/health.json
          git config user.name "repo-trend-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add repo-trend-tracker/data/snapshots.csv repo-trend-tracker/data/notified.json repo-trend-tracker/data/health.json repo-trend-tracker/dashboard/data.json docs/repo-trend-tracker/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update trend snapshot [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No tracker data changes to commit."
          fi
